<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#8b5cf6">
<title>没钱考什么公 · 行测/申论/事业编</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%238b5cf6'/><text x='50' y='68' font-size='52' text-anchor='middle'>✍️</text></svg>">
<script>
  // 主题初始化（防闪烁）：localStorage > 系统
  (function () {
    var t = localStorage.getItem('theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  })();
</script>
</head>
<body>
<div id="boot-splash" style="display:none;position:fixed;inset:0;z-index:9999;background:#8b5cf6;color:#fff;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:system-ui,sans-serif;text-align:center;padding:24px">
  <div style="font-size:20px;font-weight:600">考公刷题</div>
  <div style="font-size:13px;opacity:.85">正在准备题库，首次启动需复制题库文件…</div>
  <div style="width:160px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);overflow:hidden"><div id="boot-splash-bar" style="width:0%;height:100%;background:#fff;border-radius:2px;transition:width .3s"></div></div>
</div>
<div id="app">
  <header id="topbar">
    <button id="btn-back" class="icon-btn spacer" aria-label="返回">←</button>
    <h1 id="app-title">没钱考什么公</h1>
    <div id="topbar-right">
      <button id="btn-theme" class="icon-btn" aria-label="切换深浅色"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg></button>
    </div>
  </header>

  <main id="view">
    <!-- 视图由 JS 渲染 -->
  </main>

  <nav id="bottom-nav" style="display:none">
    <button data-nav="home" class="nav-item active"><span class="nav-ico"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg></span>首页</button>
    <button data-nav="papers" class="nav-item"><span class="nav-ico"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg></span>智能组卷</button>
    <button data-nav="wrong" class="nav-item"><span class="nav-ico"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5Z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/><path d="M9 7h7M9 11h5"/></svg></span>错题</button>
    <button data-nav="fav" class="nav-item"><span class="nav-ico"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1Z"/></svg></span>收藏</button>
  </nav>
</div>

<div id="toast" class="toast"></div>
<script src="crop-math.js"></script>
<script src="local-bootstrap.js"></script>
<script src="telemetry.js"></script>
<script src="app.js"></script>
</body>
</html>
