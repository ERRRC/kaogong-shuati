<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><title>App 图标方案预览</title>
<style>
  body { background:#0f172a; color:#e2e8f0; font-family: system-ui, 'Microsoft YaHei', sans-serif; margin:0; padding:40px 24px; }
  h1 { text-align:center; font-size:22px; margin:0 0 6px; }
  .sub { text-align:center; color:#94a3b8; font-size:13px; margin-bottom:32px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:20px; max-width:1180px; margin:0 auto; }
  .card { background:#1e293b; border-radius:16px; padding:20px; text-align:center; border:1px solid #334155; }
  .icons { display:flex; gap:14px; justify-content:center; margin-bottom:14px; }
  .icons img { width:112px; height:112px; border-radius:18px; box-shadow:0 8px 24px rgba(0,0,0,.35); }
  .name { font-size:16px; font-weight:700; margin-bottom:6px; color:#fff; }
  .desc { font-size:12.5px; color:#94a3b8; line-height:1.7; }
</style>
</head>
<body>
  <h1>🎯 请选择 App 图标方案</h1>
  <div class="sub">左为桌面方形图标 · 右为圆形图标（同一方案两种裁切）· 告诉我你要哪一版（如 "B"）</div>
  <div class="grid">
  <div class="card" style="--accent: #3b82f6">
    <div class="icons">
      <img src="icon-A-square.png" alt="方形"/>
      <img src="icon-A-round.png" alt="圆形"/>
    </div>
    <div class="name">A · 深蓝书勾</div>
    <div class="desc">深蓝渐变 + 翻开的书 + 金色对勾：沉稳、刷题感强，最"备考"</div>
  </div>
  <div class="card" style="--accent: #8b5cf6">
    <div class="icons">
      <img src="icon-B-square.png" alt="方形"/>
      <img src="icon-B-round.png" alt="圆形"/>
    </div>
    <div class="name">B · 靛紫上岸帽</div>
    <div class="desc">靛蓝紫渐变 + 学士帽（毕业帽）+ 金色流苏：寓意"上岸"</div>
  </div>
  <div class="card" style="--accent: #f97316">
    <div class="icons">
      <img src="icon-C-square.png" alt="方形"/>
      <img src="icon-C-round.png" alt="圆形"/>
    </div>
    <div class="name">C · 朱红折桂</div>
    <div class="desc">红橙渐变 + 书本 + 金色桂冠：热血冲刺、金榜题名</div>
  </div>
  <div class="card" style="--accent: #10b981">
    <div class="icons">
      <img src="icon-D-square.png" alt="方形"/>
      <img src="icon-D-round.png" alt="圆形"/>
    </div>
    <div class="name">D · 青绿盾牌</div>
    <div class="desc">青绿渐变 + 盾牌 + 白色对勾：可靠、专业、公信力</div>
  </div>
  <div class="card" style="--accent: #f59e0b">
    <div class="icons">
      <img src="icon-E-square.png" alt="方形"/>
      <img src="icon-E-round.png" alt="圆形"/>
    </div>
    <div class="name">E · 暖橙书星</div>
    <div class="desc">暖橙渐变 + 书卷 + 金色星星：轻松积极、日积月累</div>
  </div></div>
</body>
</html>
