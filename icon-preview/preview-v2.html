<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><title>App 图标方案预览 · 第二版（轻量诙谐风）</title>
<style>
  body { background:#f8fafc; color:#1e293b; font-family: system-ui, 'Microsoft YaHei', sans-serif; margin:0; padding:40px 24px; }
  h1 { text-align:center; font-size:22px; margin:0 0 6px; }
  .sub { text-align:center; color:#64748b; font-size:13px; margin-bottom:32px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:20px; max-width:1180px; margin:0 auto; }
  .card { background:#ffffff; border-radius:16px; padding:20px; text-align:center; border:1px solid #e2e8f0; box-shadow:0 4px 14px rgba(15,23,42,.05); }
  .icons { display:flex; gap:14px; justify-content:center; margin-bottom:14px; }
  .icons img { width:112px; height:112px; border-radius:18px; box-shadow:0 8px 24px rgba(15,23,42,.12); }
  .name { font-size:16px; font-weight:700; margin-bottom:6px; }
  .desc { font-size:12.5px; color:#64748b; line-height:1.7; }
</style>
</head>
<body>
  <h1>🎈 第二版：轻量诙谐风（请选择）</h1>
  <div class="sub">左为方形 · 右为圆形 · 告诉我用哪一版（如 "A"），或者还要继续调</div>
  <div class="grid">
  <div class="card">
    <div class="icons">
      <img src="v2-A-square.png" alt="方形"/>
      <img src="v2-A-round.png" alt="圆形"/>
    </div>
    <div class="name">A · 上岸鸭</div>
    <div class="desc">谐音梗「上岸鸭」：天蓝水面 + 小黄鸭，考公圈最火的梗</div>
  </div>
  <div class="card">
    <div class="icons">
      <img src="v2-B-square.png" alt="方形"/>
      <img src="v2-B-round.png" alt="圆形"/>
    </div>
    <div class="name">B · 锦鲤</div>
    <div class="desc">「转发锦鲤」上岸梗：薄荷绿底 + 白色锦鲤跃出水面</div>
  </div>
  <div class="card">
    <div class="icons">
      <img src="v2-C-square.png" alt="方形"/>
      <img src="v2-C-round.png" alt="圆形"/>
    </div>
    <div class="name">C · 笑面书</div>
    <div class="desc">拟人化：一本咧嘴笑的书，轻快治愈、做题不苦</div>
  </div>
  <div class="card">
    <div class="icons">
      <img src="v2-D-square.png" alt="方形"/>
      <img src="v2-D-round.png" alt="圆形"/>
    </div>
    <div class="name">D · 咸鱼翻身</div>
    <div class="desc">「咸鱼翻身」梗：深夜蓝底 + 白色微笑咸鱼，自嘲又励志</div>
  </div>
  <div class="card">
    <div class="icons">
      <img src="v2-E-square.png" alt="方形"/>
      <img src="v2-E-round.png" alt="圆形"/>
    </div>
    <div class="name">E · 铜钱袋</div>
    <div class="desc">自嘲「没钱」：暖黄底 + 鼓鼓钱袋 + 金色方孔铜钱，求上岸发财</div>
  </div></div>
</body>
</html>
